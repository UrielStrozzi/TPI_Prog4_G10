spring.application.name=g10

# ── Base de datos ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/subastas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ────────────────────────────────────────────────────────
jwt.secret=c3ViYXN0YXNfc2VjcmV0X2tleV8yMDI1X3N1cGVyX2xhcmdhX3BhcmFfaHM1MTI=
jwt.expiration=86400000

# ── Servidor ───────────────────────────────────────────────────
server.port=8080

# ── Scheduler (transiciones automáticas de subasta) ───────────
spring.task.scheduling.pool.size=2